databases:
  - name: cricket-db
    databaseName: cricket_db
    user: cricket_user
    plan: free

services:
  - type: web
    name: cricket-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn cricket_backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cricket-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.11.9
